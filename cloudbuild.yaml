steps:
# 1. Build the container image
- name: 'gcr.io/cloud-builders/docker'
  args: [
      'build',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/firebaseapphosting-images/mercadosorcery:latest',
      './mysite'
    ]

# 2. Push the container image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/firebaseapphosting-images/mercadosorcery:latest']

# 3. Deploy container image to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - 'mercadosorcery'
    - '--image'
    - 'us-central1-docker.pkg.dev/$PROJECT_ID/firebaseapphosting-images/mercadosorcery:latest'
    - '--region'
    - 'us-central1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'
    - '--port'
    - '8080'
